name: Build

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "*"

# Declare default permissions as read only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sova:
    name: Build Sova
    strategy:
      matrix:
        java:
          - version: "21"
            mainBuild: true
          - version: "25"
            mainBuild: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          javaVersion: ${{ matrix.java.version }}

      - name: Build binaries using build-binaries action
        uses: strimzi/github-actions/.github/actions/build/build-binaries@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          mainJavaBuild: ${{ matrix.java.mainBuild }}
          artifactSuffix: "sova"
          clusterOperatorBuild: "false"
        env:
          # The broker-backed tests live behind the failsafe profile, so without it the only
          # thing that ever exercises Sova against a real Kafka never runs. Docker is available
          # on ubuntu-latest, which is all strimzi-test-container needs.
          MVN_ARGS: '-B -Pfailsafe'

      - name: Upload test coverage to Codecov
        if: ${{ matrix.java.mainBuild }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./**/target/site/jacoco/jacoco.xml
          flags: unittests,integrationtests
          name: codecov-integration
          fail_ci_if_error: false

  # Publishes the dist ZIP to GHCR as an OCI artifact on every push to main, so that
  # strimzi-kafka-operator can consume a snapshot build before Sova has GitHub release.
  #
  # The artifact is tagged with the Maven version (`0.1.0-SNAPSHOT`), which is the string the
  # operators repository holds in its `sova.version` file. Its Makefile looks for
  # `binaries/sova-$(SOVA_VERSION)-dist.zip`, and the ZIP inside the artifact carries that same
  # version in its name, so a pull lands the file under the name already expected - no renaming,
  # and one command that works for both a snapshot and a release.
  publish-snapshot:
    name: Publish snapshot to GHCR
    needs: build-sova
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-sova.tar

      - name: Extract the dist ZIP
        id: dist
        run: |
          tar -xf binaries-sova.tar
          zip_path=$(find . -name 'sova-*-dist.zip' -print -quit)
          if [ -z "$zip_path" ]; then
            echo "::error::No sova-*-dist.zip found in binaries-sova.tar"
            exit 1
          fi
          # ORAS records the path it is handed as the layer title, so the ZIP has to be pushed
          # from the directory holding it. Otherwise `oras pull -o binaries/` on the consumer side
          # recreates ./target/ underneath the output directory.
          mv "$zip_path" .
          zip_name=$(basename "$zip_path")
          version=${zip_name#sova-}
          echo "zip=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version%-dist.zip}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the dist ZIP to GHCR
        env:
          ZIP: ${{ steps.dist.outputs.zip }}
          VERSION: ${{ steps.dist.outputs.version }}
        run: |
          # The owner comes from the environment rather than being hardcoded to `strimzi` so that
          # a fork publishes into its own namespace. GHCR requires it lowercase, which a fork
          # owner is not guaranteed to be.
          owner=${GITHUB_REPOSITORY_OWNER,,}
          oras push "ghcr.io/${owner}/dist-sova:${VERSION}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${ZIP}:application/zip"
