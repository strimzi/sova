name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 0.1.0 for GA or 0.1.0-rc1 for RC)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  # Builds sova-<version>-dist.zip and uploads it as the release-sova-<version>.tar workflow
  # artifact. The GitHub release itself is created by hand from that artifact, as for the other
  # Strimzi projects.
  prepare-release-artifacts:
    name: Build the Sova distribution
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Release version '$RELEASE_VERSION' must look like 0.1.0 or 0.1.0-rc1"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          javaVersion: "21"

      - name: Prepare release artifacts
        uses: strimzi/github-actions/.github/actions/build/release-artifacts@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "sova"

  # Signs the distribution with Sigstore and re-uploads the artifact with the provenance bundle.
  # This replaces a published checksum: consumers run
  # `gh attestation verify sova-<version>-dist.zip --repo strimzi/sova`.
  attest:
    name: Attestation
    needs:
      - prepare-release-artifacts
    permissions:
      contents: read
      # OIDC token for Sigstore signing
      id-token: write
      # GitHub Attestation API
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
    with:
      artifactSuffix: "sova"
      releaseVersion: ${{ inputs.releaseVersion }}

  # Publishes the released dist ZIP to GHCR under its release version, into the same
  # `ghcr.io/strimzi/dist-sova` package that pushes to main keep up to date with the snapshot.
  # This is what strimzi-kafka-operator pulls once `sova.version` moves off the snapshot.
  #
  # It runs after `attest` so the bytes published here are the attested ones — the attestation is
  # over the ZIP's digest, so `gh attestation verify sova-<version>-dist.zip --repo strimzi/sova`
  # holds for the copy pulled from GHCR just as it does for the GitHub release asset.
  publish-dist:
    name: Publish the distribution to GHCR
    needs:
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sova-${{ inputs.releaseVersion }}.tar

      - name: Extract the dist ZIP
        id: dist
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          tar -xf "release-sova-${RELEASE_VERSION}.tar"
          zip_path=$(find . -name 'sova-*-dist.zip' -print -quit)
          if [ -z "$zip_path" ]; then
            echo "::error::No sova-*-dist.zip found in release-sova-${RELEASE_VERSION}.tar"
            exit 1
          fi
          # See the note in build.yml: ORAS uses the given path as the layer title.
          mv "$zip_path" .
          zip_name=$(basename "$zip_path")
          # Taken from the file name rather than from the input, because `make release` upper-cases
          # the version into the POM, so an -rc1 input ships as sova-<x.y.z>-RC1-dist.zip. The tag
          # has to match the file name, since that is what the consumer's Makefile looks for.
          version=${zip_name#sova-}
          echo "zip=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version%-dist.zip}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the dist ZIP to GHCR
        env:
          ZIP: ${{ steps.dist.outputs.zip }}
          VERSION: ${{ steps.dist.outputs.version }}
        run: |
          # See the note in build.yml on why the owner is read from the environment.
          owner=${GITHUB_REPOSITORY_OWNER,,}
          oras push "ghcr.io/${owner}/dist-sova:${VERSION}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${ZIP}:application/zip"

  snyk-scan:
    name: Snyk Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  fossa-scan:
    name: FOSSA Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fossa.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}