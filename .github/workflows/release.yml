name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 0.1.0 for GA or 0.1.0-rc1 for RC)'
        required: true
        type: string
      sourceBuildRunId:
        description: 'GitHub Actions Run ID of the source build (find in Actions tab URL)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  # Takes sova-<GA version>-dist.zip from the Build workflow run given by `sourceBuildRunId` and
  # uploads it as sova-<releaseVersion>-dist.zip in the release-sova-<releaseVersion>.tar workflow
  # artifact. The GitHub release itself is created by hand from that artifact, as for the other
  # Strimzi projects.
  #
  # Nothing is built here. The ZIP is built by the Build workflow from the release branch, which
  # already has the GA version set, so an RC and the GA released from the same build run carry
  # identical bytes: the RC version only changes the file name, never the content.
  prepare-release-artifacts:
    name: Prepare the Sova distribution
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Download the artifact of the source build run
      actions: read
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            echo "::error::Release version '$RELEASE_VERSION' must look like 0.1.0 or 0.1.0-rc1"
            exit 1
          fi
          echo "gaVersion=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Download Sova binaries from the source build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-sova.tar
          run-id: ${{ inputs.sourceBuildRunId }}
          github-token: ${{ github.token }}

      - name: Create the release tarball
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          GA_VERSION: ${{ steps.version.outputs.gaVersion }}
        run: |
          tar -xf binaries-sova.tar

          # The source build has to come from the release branch prepared for the GA version, not
          # from a snapshot or from a different release
          built_zip="target/sova-${GA_VERSION}-dist.zip"
          if [ ! -f "$built_zip" ]; then
            echo "::error::The source build does not contain ${built_zip}, it contains: $(cd target && echo sova-*-dist.zip)"
            exit 1
          fi

          mkdir -p release
          cp "$built_zip" "release/sova-${RELEASE_VERSION}-dist.zip"
          tar -C release -cvf "release-sova-${RELEASE_VERSION}.tar" "sova-${RELEASE_VERSION}-dist.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sova-${{ inputs.releaseVersion }}.tar
          path: release-sova-${{ inputs.releaseVersion }}.tar
          retention-days: 30

  # Signs the distribution with Sigstore and re-uploads the artifact with the provenance bundle.
  # This replaces a published checksum: consumers run
  # `gh attestation verify sova-<version>-dist.zip --repo strimzi/sova`.
  # The attestation is over the ZIP's digest, which renaming does not change, so the bundle of an
  # RC also verifies the GA ZIP released from the same source build.
  attest:
    name: Attestation
    needs:
      - prepare-release-artifacts
    permissions:
      contents: read
      # OIDC token for Sigstore signing
      id-token: write
      # GitHub Attestation API
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
    with:
      artifactSuffix: "sova"
      releaseVersion: ${{ inputs.releaseVersion }}

  # Publishes the released dist ZIP to GHCR under its release version, into the same
  # `ghcr.io/strimzi/dist-sova` package that pushes to main keep up to date with the snapshot.
  # This is what strimzi-kafka-operator pulls once `sova.version` moves off the snapshot.
  #
  # It runs after `attest` so the bytes published here are the attested ones — the attestation is
  # over the ZIP's digest, so `gh attestation verify sova-<version>-dist.zip --repo strimzi/sova`
  # holds for the copy pulled from GHCR just as it does for the GitHub release asset.
  publish-dist:
    name: Publish the distribution to GHCR
    needs:
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: strimzi/github-actions/.github/actions/dependencies/install-oras@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.3.6"

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sova-${{ inputs.releaseVersion }}.tar

      - name: Extract the dist ZIP
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: tar -xf "release-sova-${RELEASE_VERSION}.tar" "sova-${RELEASE_VERSION}-dist.zip"

      # The tag and the file name inside it are both the release version, since that is what the
      # consumer's Makefile looks for.
      - name: Push the dist ZIP to GHCR
        uses: strimzi/github-actions/.github/actions/build/push-oci-artifact@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          file: sova-${{ inputs.releaseVersion }}-dist.zip
          name: dist-sova
          tag: ${{ inputs.releaseVersion }}
          mediaType: application/zip

  snyk-scan:
    name: Snyk Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  fossa-scan:
    name: FOSSA Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fossa.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
